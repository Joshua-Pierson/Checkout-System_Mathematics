<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout System</title>

  <script src="js/api.js" defer></script>
  <script src="js/student_cart.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <h1>Checkout System</h1>

  <!-- Switch between the student and manager views. -->
  <nav aria-label="Choose view">
    <button id="student-view-button" type="button">Student</button>
    <button id="manager-view-button" type="button">Manager</button>
  </nav>

    <main>
    <section id="student-section" aria-labelledby="cart-heading">
      <h2 id="cart-heading">Student Cart</h2>

      <h3>Available Products</h3>

      <!-- Task 1939: Browse categories. -->
      <label for="category-filter">Browse by category</label>
      <select id="category-filter" disabled>
        <option value="">All categories</option>
      </select>

      <!-- Task 1940: Search by part of an item name. -->
      <label for="product-search">Search by item name</label>
      <input
        id="product-search"
        type="search"
        placeholder="Type part of a name"
        disabled
      >

      <p id="catalog-message" role="status" aria-live="polite"></p>

      <table>
        <caption>Choose a category or search, then add an item</caption>
        <thead>
          <tr>
            <th scope="col">Item Code</th>
            <th scope="col">Item Name</th>
            <th scope="col">Item Cost</th>
            <th scope="col">Category</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>

      <h3>Add an Item by Code</h3>

      <form id="add-item-form">
        <label for="item-code">Item code</label>
        <input
          id="item-code"
          name="item-code"
          type="text"
          maxlength="30"
          placeholder="Example: 1001"
          required
          autocomplete="off"
        >
        <button type="submit">Add Item</button>
      </form>

      <p id="item-message" role="status" aria-live="polite"></p>

      <h3>Your Cart</h3>
      <div id="added-items"></div>
      <p id="cart-total">Cart total: $0.00</p>

      <!-- Cancel the whole transaction. -->
      <button id="cancel-transaction" type="button" disabled>
        Cancel Transaction
      </button>
    </section>

    <section
      id="manager-section"
      aria-labelledby="manager-heading"
      hidden
    >
      <h2 id="manager-heading">Manager View</h2>
      <p><a href="manager/Manager Menu.html">Go to Manager Menu</a></p>
    </section>
  </main>
</body>
</html>
