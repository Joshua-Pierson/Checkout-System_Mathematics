<html>

<!-- This HTML page contains logic for adding items to a catalog. -->

    <head>
        <link rel="stylesheet" href="../style/layout.css">
        <title>Catalog Management (Add)</title>
    </head>

<body>
<h1  style="color: rgb(255, 255, 255);">Add to Catalog</h1>
    <nav>
        <ul>
            <li><a href="../Manager Menu.html">Go Back</a></li>
    
        </ul>
    </nav>

    <!-- The lines in this form tag are meant to send inputted data to a backend. -->

    <form id="addForm" method="post">
        <label for="itemName">Item Name:</label>
        <input type="text" id="itemName" name="itemName" required><br><br>

        <label for="itemID">Item ID:</label>
        <input type="text" id="itemID" name="itemID" required><br><br>

        <label for="itemCategory">Item Category:</label>
        <input type="text" id="itemCategory" name="itemCategory" required><br><br>

        <label for="itemPrice">Item Price:</label>
        <input type="number" id="itemPrice" name="itemPrice" required><br><br>

        <input type="submit" value="Add to Catalog">
    </form>

<script src="../script/magics.js"></script>
</body>

</html>
