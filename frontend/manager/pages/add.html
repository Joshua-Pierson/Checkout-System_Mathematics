<html>

<!-- This HTML page contains logic for adding items to a catalog. -->

    <head>
        <link rel="stylesheet" href="../style/layout.css">
        <title>Catalog Management (Add)</title>
    </head>

<body>
<h1  style="color: rgb(255, 255, 255);">Add to Catalog</h1>
    <nav>
        <ul>
            <li><a href="../Manager Menu.html">Go Back</a></li>
    
        </ul>
    </nav>

    <!-- The lines in this form tag are meant to send inputted data to a backend. -->

    <form id="addForm" method="post">
        <label for="item_id">Item ID:</label>
        <input type="text" id="item_id" name="item_id" required><br><br>
        
        <label for="name">Item Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="unit_price">Item Price:</label>
        <input type="number" step=".01" id="unit_price" name="unit_price" required><br><br>

        <label for="category">Item Category:</label>
        <input type="text" id="category" name="category" required><br><br>

        <label for="stock_quantity">Stock Quantity:</label>
        <input type="number" id="stock_quantity" name="stock_quantity" required><br><br>

        <label for="tax_rate">Tax Rate:</label>
        <input type="number" step="0.0001" id="tax_rate" name="tax_rate" min="0" max="1" required><br><br>

        <input type="submit" value="Add to Catalog">
    </form>

<script src="../script/magics.js"></script>
</body>

</html>
