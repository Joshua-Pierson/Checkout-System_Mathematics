services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
      - FLASK_APP=main.py
      - DB_HOST=db 
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=pos_inventory
    depends_on:
      - db
    # Triggers the Python seed script before launching the Flask server
    command: >
      bash -c "python seed.py && flask run --host=0.0.0.0"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pos_inventory
    volumes:
      - mysql_data:/var/lib/mysql
      # Projects the SQL schema into the container's native boot sequence
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: