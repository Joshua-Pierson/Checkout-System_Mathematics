services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
      - FLASK_APP=main.py
      - DB_HOST=db 
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=pos_inventory
    depends_on:
      - db

  # scaffolded for tomorrow's stand-up
  # frontend:
  #   build:
  #     context: ./frontend
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:5000
  #   depends_on:
  #     - backend

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pos_inventory
    volumes:
      - mysql_data:/var/lib/mysql
      # Uncomment tomorrow once init.sql is created
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: