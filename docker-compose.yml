services:
  backend:
    build: ./backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
      - FLASK_APP=main.py
      - DB_HOST=db 
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=pos_inventory
    depends_on:
      - db
    # Corrected the path to the seed script
    command: >
      bash -c "python data/seed.py && flask run --host=0.0.0.0"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Corrected the variable name and pointed it to the mapped Mac port
      - VITE_API_BASE_URL=http://localhost:5001
    depends_on:
      - backend

  db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=pos_inventory
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: